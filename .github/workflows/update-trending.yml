name: Update Trending Data

on:
  schedule:
    # 每周五 UTC 00:00 自动运行（北京时间 08:00）
    - cron: "0 0 * * 5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-trending:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Fetch Trending data
        run: node scripts/fetch-trending.js

      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet src/lib/trending-data.json; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/lib/trending-data.json
          git commit -m "chore: update trending data"
          git push
